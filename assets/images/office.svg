<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">فضای کاری مدرن</title><desc id="desc">تصویرسازی برداری از دفتر کار روشن با پنجره‌های قدی، میزهای کاری و اتاق جلسه</desc>
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eff4f1"/><stop offset="1" stop-color="#c6d9d2"/></linearGradient>
 <linearGradient id="window" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8e0d9"/><stop offset="1" stop-color="#6d9f9d"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d5c8b7"/><stop offset="1" stop-color="#a9917d"/></linearGradient>
 <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#345b64"/><stop offset="1" stop-color="#173747"/></linearGradient>
 <filter id="shade"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1200" height="700" fill="url(#wall)"/>
<path d="M0 480L1200 440v260H0z" fill="url(#floor)"/>
<!-- large windows -->
<rect x="65" y="55" width="650" height="410" rx="16" fill="#f8fbf8" stroke="#fff" stroke-width="14"/>
