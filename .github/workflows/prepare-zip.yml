name: Prepare Hamkar ZIP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-zip.yml'
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hamkar
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout Amlak Magoni source
        uses: actions/checkout@v4
        with:
          repository: mhmdmgwny34-web/amlak-magoni
          ref: main
          path: /tmp/amlak-magoni
      - name: Copy original images and place them in the design
        run: |
          mkdir -p assets/images
          cp /tmp/amlak-magoni/assets/images/avatar-2.jpg assets/images/team-avatar-1.jpg
          cp /tmp/amlak-magoni/assets/images/avatar-4.jpg assets/images/team-avatar-2.jpg
          cp /tmp/amlak-magoni/assets/images/avatar-5.jpg assets/images/team-avatar-3.jpg
          cp /tmp/amlak-magoni/assets/images/blog-1.jpg assets/images/journal-strategy.jpg
          cp /tmp/amlak-magoni/assets/images/blog-2.jpg assets/images/journal-experience.jpg
          cp /tmp/amlak-magoni/assets/images/blog-3.jpg assets/images/journal-process.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          s=s.replace('<span class="person-avatar">ن</span>','<span class="person-avatar"><img src="assets/images/team-avatar-1.jpg" alt="نگار رضایی"></span>')
          s=s.replace('<span class="person-avatar avatar-two">م</span>','<span class="person-avatar avatar-two"><img src="assets/images/team-avatar-2.jpg" alt="مهدی کاظمی"></span>')
          s=s.replace('<span class="person-avatar avatar-three">س</span>','<span class="person-avatar avatar-three"><img src="assets/images/team-avatar-3.jpg" alt="سارا احمدی"></span>')
          s=s.replace('<div class="team-portrait">ن</div>','<div class="team-portrait"><img src="assets/images/team-avatar-1.jpg" alt="تصویر نگار رضایی"></div>')
          s=s.replace('<div class="team-portrait portrait-two">آ</div>','<div class="team-portrait portrait-two"><img src="assets/images/team-avatar-2.jpg" alt="تصویر آرمان موسوی"></div>')
          s=s.replace('<div class="team-portrait portrait-three">س</div>','<div class="team-portrait portrait-three"><img src="assets/images/team-avatar-3.jpg" alt="تصویر سحر کریمی"></div>')
          s=s.replace('<div class="journal-art journal-one"><span>01 / STRATEGY</span></div>','<div class="journal-art journal-one"><img src="assets/images/journal-strategy.jpg" alt="تصویر مقاله استراتژی کسب‌وکار"><span>01 / STRATEGY</span></div>')
          s=s.replace('<div class="journal-art journal-two"><span>02 / EXPERIENCE</span></div>','<div class="journal-art journal-two"><img src="assets/images/journal-experience.jpg" alt="تصویر مقاله تجربه مشتری"><span>02 / EXPERIENCE</span></div>')
          s=s.replace('<div class="journal-art journal-three"><span>03 / PROCESS</span></div>','<div class="journal-art journal-three"><img src="assets/images/journal-process.jpg" alt="تصویر مقاله بهبود فرایندها"><span>03 / PROCESS</span></div>')
          p.write_text(s)
          p=Path("blog.html")
          s=p.read_text()
          s=s.replace('<div class="journal-art journal-one"><span>01 / STRATEGY</span></div>','<div class="journal-art journal-one"><img src="assets/images/journal-strategy.jpg" alt="تصویر مقاله استراتژی کسب‌وکار"><span>01 / STRATEGY</span></div>')
          s=s.replace('<div class="journal-art journal-two"><span>02 / EXPERIENCE</span></div>','<div class="journal-art journal-two"><img src="assets/images/journal-experience.jpg" alt="تصویر مقاله تجربه مشتری"><span>02 / EXPERIENCE</span></div>')
          s=s.replace('<div class="journal-art journal-three"><span>03 / PROCESS</span></div>','<div class="journal-art journal-three"><img src="assets/images/journal-process.jpg" alt="تصویر مقاله بهبود فرایندها"><span>03 / PROCESS</span></div>')
          p.write_text(s)
          p=Path("assets/css/style.css")
          s=p.read_text()+"""
/* Original imagery reused from the Amlak Magoni project */
.team-portrait img{width:100%;height:100%;object-fit:cover;display:block}
.person-avatar{overflow:hidden;flex:0 0 38px}
.person-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.journal-art{isolation:isolate}
.journal-art>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.journal-art:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,24,38,.68),rgba(10,24,38,.05));z-index:-1}
"""
          p.write_text(s)
          PY
      - name: Commit updated site assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images index.html blog.html assets/css/style.css
          git commit -m "Add original Amlak Magoni photos to Hamkar sections" || echo "No changes"
          git push
      - name: Create ZIP package
        run: |
          cd ..
          zip -qr hamkar-ready-for-rashtchin.zip hamkar-corporate-template -x "hamkar-corporate-template/.git/*"
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamkar-ready-for-rashtchin
          path: ../hamkar-ready-for-rashtchin.zip
          if-no-files-found: error
          retention-days: 7
